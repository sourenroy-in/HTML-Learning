<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>

<body>
    <table border="black">
        <caption>A test table with merged cells</caption>
        <tr>
            <td colspan="">Gender</td>
            <td colspan="2">Average</td>
            <td rowspan="">Red Eyes</td>
        </tr>
        <tr>
            <td>Males</td>
            <td>1.9</td>
            <td>0.033</td>
            <td>40%</td>
        </tr>
        <tr>
            <td>Females</td>
            <td>1.7</td>
            <td>0.022</td>
            <td>43%</td>
        </tr>
    </table>
</body>

</html>
